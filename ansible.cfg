[defaults]
inventory=inventory
remote_user=student
host_key_checking=false
ask_pass=False

collections_path=collections:/home/student/.ansible/collections:/usr/share/ansible/collections
roles_path=roles:/home/student/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles

[privilege_escalation]
become=True
become_method=sudo
become_user=root
become_ask_pass=False
